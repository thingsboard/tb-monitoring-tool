name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t tb-monitoring:ci .
